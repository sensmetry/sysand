[package]
name = "sysand-py"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true

[features]
default = ["extension-module", "abi3", "tls-aws-lc-rs"]
extension-module = ["pyo3/extension-module"]
abi3 = ["pyo3/abi3-py310", "pyo3/abi3t-py315"]
tls-aws-lc-rs = ["sysand-core/tls-aws-lc-rs", "sysand/tls-aws-lc-rs"]
tls-ring = ["sysand-core/tls-ring", "sysand/tls-ring"]
kpar-bzip2 = ["sysand-core/kpar-bzip2", "sysand/kpar-bzip2"]
kpar-zstd = ["sysand-core/kpar-zstd", "sysand/kpar-zstd"]
kpar-xz = ["sysand-core/kpar-xz", "sysand/kpar-xz"]
kpar-ppmd = ["sysand-core/kpar-ppmd", "sysand/kpar-ppmd"]

[dependencies]
sysand-core = { workspace = true, features = ["python", "filesystem", "networking"] }
sysand = { path = "../../sysand", default-features = false }
anyhow.workspace = true
camino.workspace = true
fluent-uri.workspace = true
pyo3.workspace = true
pyo3-log = { version = "0.13.3", default-features = false }
log.workspace = true
semver.workspace = true
typed-path = { workspace = true, features = ["std"] }
url.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
predicates.workspace = true
camino-tempfile.workspace = true
# silence output in tests
anstream = { workspace = true, features = ["test"] }

[lints]
workspace = true
