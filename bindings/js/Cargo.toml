[package]
name = "sysand-js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
sysand-core = { workspace = true, features = ["js"] }
camino.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasm-bindgen = { version = "0.2.114", default-features = false, features = ["std"] }
web-sys = { version = "0.3.91", default-features = false, optional = true, features = [
  "Window",
  "Storage"
] }
serde.workspace = true
console_log = { version = "1.0.0", default-features = false }
log.workspace = true
typed-path.workspace = true

[dev-dependencies]
regex = { version = "1.12.3", default-features = false, features = ["unicode-perl"] }
semver.workspace = true
wasm-bindgen-test = { version = "0.3.64", default-features = false, features = ["std"] }

[features]
default = ["browser"]
browser = ["dep:web-sys"]

[lints]
workspace = true
