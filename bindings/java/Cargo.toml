[package]
name = "sysand-java"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true

[lib]
name = "sysand"
crate-type = ["cdylib"]

[features]
# `default` exists only to name the crypto provider this cdylib ships:
# `scripts/java-builder.py` builds with no `--features`, so without it every
# Java build would get `networking` with no provider and fail on the first
# request. See `sysand-core`'s `tls-*` features.
default = ["tls-aws-lc-rs"]
tls-aws-lc-rs = ["sysand-core/tls-aws-lc-rs"]
tls-ring = ["sysand-core/tls-ring"]
kpar-bzip2 = ["sysand-core/kpar-bzip2"]
kpar-zstd = ["sysand-core/kpar-zstd"]
kpar-xz = ["sysand-core/kpar-xz"]
kpar-ppmd = ["sysand-core/kpar-ppmd"]

[dependencies]
sysand-core = { workspace = true, features = ["filesystem", "networking"] }
camino.workspace = true
fluent-uri.workspace = true
env_logger.workspace = true
jni = { version = "0.22.4", default-features = false }
indexmap.workspace = true
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
