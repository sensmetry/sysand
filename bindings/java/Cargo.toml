[package]
name = "sysand-java"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true

[lib]
name = "sysand"
crate-type = ["cdylib"]

[features]
kpar-bzip2 = ["sysand-core/kpar-bzip2"]
kpar-zstd = ["sysand-core/kpar-zstd"]
kpar-xz = ["sysand-core/kpar-xz"]
kpar-ppmd = ["sysand-core/kpar-ppmd"]

[dependencies]
sysand-core = { path = "../../core", features = ["std", "filesystem", "networking"] }
camino.workspace = true
fluent-uri.workspace = true
env_logger.workspace = true
jni = "0.22.4"
indexmap = { version = "2.13.0", default-features = false, features = ["serde"] }
tokio = { version = "1.50.0", default-features = false, features = ["rt"] }

[lints]
workspace = true
