# zizmor is a static analysis tool for GitHub Actions workflows that detects
# security issues, misconfigurations, and best-practice violations.
#
# config ref: https://docs.zizmor.sh/configuration/#discovery
# rules ref:  https://docs.zizmor.sh/audits/
#
rules:
  # Cache poisoning is when a cache entry is manipulated to inject malicious
  # content into a build that trusts it.
  #
  # Caches are scoped per ref [1]: a run restores entries from its own ref, the
  # default branch, and (for PRs) the base branch, and saves only to its own
  # ref. So PR caches never reach main or tag runs. However, any step of any
  # job on main can write main's caches (the cache token is available to every
  # step, regardless of `permissions`), and tag runs restore main's caches.
  #
  # Jobs that produce released artefacts therefore skip all caches on tag
  # builds (rust-cache, sccache, setup-uv), marked with a comment pointing
  # here. Main-branch builds (nightly release, Maven snapshots) keep caching.
  #
  # zizmor can't evaluate those `if:` guards and flags every cache in a
  # workflow triggered by tags, so the rule stays disabled.
  #
  # [1]: https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#restrictions-for-accessing-a-cache
  #
  cache-poisoning:
    disable: true
