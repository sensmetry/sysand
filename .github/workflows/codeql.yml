name: CodeQL

# Static security analysis (taint tracking: path traversal, request forgery,
# cleartext logging of credentials, ...). Complements clippy, cargo-deny,
# osv-scanner and zizmor, none of which do dataflow analysis.
#
# All languages use `build-mode: none`, so no compilation happens and each job
# only runs extraction and queries.
#
# GitHub Actions workflows are not analysed here: zizmor already covers them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            # Integration tests are not shipped code; inline unit tests stay
            # in scope.
            config: |
              paths-ignore:
                - "**/tests/**"
          - language: python
          - language: java-kotlin
          - language: javascript-typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: ${{ matrix.config }}
          queries: security-extended

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
