[package]
name = "sysand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true

[features]
default = ["tls-aws-lc-rs"]
tls-aws-lc-rs = ["sysand-core/tls-aws-lc-rs"]
tls-ring = ["sysand-core/tls-ring"]
alltests = []
# Different compression methods for creating KPARs
kpar-bzip2 = ["sysand-core/kpar-bzip2"]
kpar-zstd = ["sysand-core/kpar-zstd"]
kpar-xz = ["sysand-core/kpar-xz"]
kpar-ppmd = ["sysand-core/kpar-ppmd"]

[dependencies]
# General
camino.workspace = true
camino-tempfile = { version = "1.4", default-features = false }
anstream = { version = "1.0.0", default-features = false, features = ["auto", "wincon"] }
anyhow = { version = "1.0.102", default-features = false, features = ["std"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
clap = { version = "4.5.60", default-features = false, features = [
  "std",
  "derive",
  "help",
  "cargo",
  "color",
  "env",
  "suggestions",
  "usage"
] }
env_logger.workspace = true
log = { workspace = true, features = ["std"] }
sysand-core = { path = "../core", features = ["filesystem", "networking", "keyring"] }
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
toml = { version = "1.0.6", default-features = false, features = ["std", "fast_hash"] }
semver = { version = "1.0.27", default-features = false, features = ["std"] }
serde_json = { version = "1.0.149", default-features = false, features = ["std"] }
spdx = { version = "0.13.4", default-features = false, features = ["std"] }
fluent-uri.workspace = true
typed-path = { version = "0.12.3", default-features = false, features = ["std"] }
url = { version = "2.5.8", default-features = false, features = ["std"] }
indexmap = { version = "2.13.0", default-features = false, features = ["std"] }
tokio = { version = "1.50.0", default-features = false }
reqwest-middleware = { version = "0.5.1", default-features = false }
rpassword = { version = "7.5.4", default-features = false }

[target."cfg(windows)".dependencies]
glob = { version = "0.3.3", default-features = false }

[dev-dependencies]
assert_cmd = { version = "2.1.2", default-features = false }
glob = { version = "0.3.3", default-features = false }
mockito = { version = "1.7.2", default-features = false, features = ["color"] }
predicates = { version = "3.1.4", default-features = false, features = ["regex", "color"] }
camino-tempfile = { version = "1.4", default-features = false }
url = { version = "2.5.8", default-features = false, features = ["std"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
# silence output in tests
anstream = { version = "1.0.0", default-features = false, features = ["test"] }

[target."cfg(not(windows))".dev-dependencies]
rexpect = { version = "0.7.0", default-features = false }
nix = { version = "0.31.2", default-features = false, features = ["process"] }

[lints]
workspace = true
