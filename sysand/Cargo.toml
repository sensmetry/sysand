[package]
name = "sysand"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true

[features]
default = ["tls-aws-lc-rs"]
tls-aws-lc-rs = ["sysand-core/tls-aws-lc-rs"]
tls-ring = ["sysand-core/tls-ring"]
alltests = []
# Different compression methods for creating KPARs
kpar-bzip2 = ["sysand-core/kpar-bzip2"]
kpar-zstd = ["sysand-core/kpar-zstd"]
kpar-xz = ["sysand-core/kpar-xz"]
kpar-ppmd = ["sysand-core/kpar-ppmd"]

[dependencies]
# General
camino.workspace = true
camino-tempfile.workspace = true
anstream = { workspace = true, features = ["auto", "wincon"] }
anyhow.workspace = true
jiff.workspace = true
clap = { version = "4.5.60", default-features = false, features = [
  "std",
  "derive",
  "help",
  "cargo",
  "color",
  "env",
  "suggestions",
  "usage"
] }
env_logger.workspace = true
log = { workspace = true, features = ["std"] }
sysand-core = { workspace = true, features = ["filesystem", "networking", "keyring"] }
thiserror.workspace = true
toml.workspace = true
semver = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
spdx.workspace = true
fluent-uri.workspace = true
typed-path = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }
indexmap = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "signal"] }
reqwest-middleware.workspace = true
rpassword = { version = "7.5.4", default-features = false }

[target."cfg(windows)".dependencies]
glob.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
gix = { workspace = true, features = ["index", "sha1"] }
glob.workspace = true
mockito.workspace = true
predicates.workspace = true
camino-tempfile.workspace = true
url = { workspace = true, features = ["std"] }
zip.workspace = true
# silence output in tests
anstream = { workspace = true, features = ["test"] }

[target."cfg(not(windows))".dev-dependencies]
rexpect = { version = "0.7.0", default-features = false }
nix = { version = "0.31.2", default-features = false, features = ["process", "signal"] }

[lints]
workspace = true
