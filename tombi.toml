[files]
# tombi by default ignores these unless passed explicitly.
# prek passes files explicitly, and knows that these are toml,
# so this ignore is needed to skip them
exclude = ["Cargo.lock", "**/uv.lock"]

[format.rules]
line-width = 100

[[schemas]]
toml-version = "v1.0.0"
path = "tombi://www.schemastore.org/cargo.json"
include = ["Cargo.toml"]
format.rules.array-values-order.enabled = false
format.rules.table-keys-order.enabled = false

[[schemas]]
toml-version = "v1.0.0"
path = "tombi://www.schemastore.org/pyproject.json"
include = ["pyproject.toml"]
format.rules.array-values-order.enabled = false
format.rules.table-keys-order.enabled = false
