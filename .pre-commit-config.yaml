# prek (Rust version of the Python based pre-commit) is a tool to perform a
# predefined set of tasks manually and/or automatically before git commits are
# made.
#
# We require prek specifically, since we want support for rust based hooks.
#
# pre-commit reference: https://pre-commit.com/#pre-commit-configyaml---top-level
# prek reference:       https://prek.j178.dev/configuration/
#
# Common tasks
#
# - Run once on all files: prek run -a
# - Register git hooks:    prek install
#
# FIXME: transition to a prek official config
#        Blocked until renovate gets prek.toml support:
#        https://github.com/renovatebot/renovate/pull/42254
#
fail_fast: true
# The `priorities` aliases need 0.4.11
minimum_prek_version: "0.4.11"

# Hook scheduling.
#
# prek runs hooks sequentially unless they share an explicit `priority`, and
# hooks with equal priority run concurrently. Hooks without a priority run
# first.
#
# The split is by write behaviour:
#
#   no priority         Hooks that may rewrite files, these must run
#                       sequentially.
#   priority: readonly  Hooks that only read. Run concurrently, after
#                       the writers.
#
# When adding a hook, leave `priority` unset unless it never writes to the
# working tree. Set `PREK_NO_CONCURRENCY=1` to force sequential runs when
# debugging.
priorities:
  readonly: 100

repos:
  # Sanity checks on the repository itself
  - repo: builtin
    hooks:
      - id: no-commit-to-branch
        priority: readonly
      - id: check-case-conflict
        priority: readonly
      - id: check-merge-conflict
        priority: readonly
      - id: check-symlinks
        priority: readonly
      - id: destroyed-symlinks
        priority: readonly
      - id: check-vcs-permalinks
        priority: readonly
      - id: check-executables-have-shebangs
        priority: readonly
      - id: check-shebang-scripts-are-executable
        priority: readonly
      # Writers.
      # stdlib_assets/ comes from upstream and .vscode/ is managed by VS Code.
      - id: trailing-whitespace
        exclude: ^(core/src/stdlib_assets/|\.vscode/)
      - id: end-of-file-fixer
        exclude: ^(core/src/stdlib_assets/|\.vscode/)

  # Autoformat: markdown, yaml, json, js
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.10
    hooks:
      - id: prettier
        exclude: |-
          (?x)(
              stdlib_assets/|
              \.lock|
              # Byte-for-byte copies of documents maintained outside this
              # repository; reformatting would stop them being compared to
              # their source with `diff`.
              design/model-toml\.md|
              design/workspaces\.md
          )

  # Autoformat: Ensure SPDX license and copyright headers
  - repo: local
    hooks:
      - id: reuse-annotate
        name: reuse annotate
        # Renovate updates `additional_dependencies` only when `language` is
        # set explicitly
        language: python
        additional_dependencies: [reuse==6.3.0]
        entry: reuse annotate
        args:
          - --license=MIT OR Apache-2.0
          - --copyright=Sysand contributors <opensource@sensmetry.com>
          - --copyright-prefix=spdx-symbol
          - --template=compact
          - --skip-existing
        exclude: |-
          (?x)(
              scripts/install\.sh|
              scripts/install\.ps1
          )
        types_or: [rust, python, java, groovy, shell, xml, javascript]

  # Autoformat: rust
  #
  # rust hooks ignore rust-toolchain.toml; language_version is what pins
  # them. Keep it in sync with rust-toolchain.toml.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        description: Formats all bin and lib files of the current workspace using rustfmt.
        language: rust
        language_version: "1.100"
        types: [rust]
        args: ["--"]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy
        description: Checks all packages in the workspace to catch common mistakes and improve your Rust code.
        language: rust
        language_version: "1.100"
        # Isolate this from all other invocations of any `run_tests.sh`
        # file/manual cargo build/check/clippy, since these run with different
        # features enabled, which causes constant build cache invalidation
        env:
          CARGO_TARGET_DIR: target/prek
        types: [rust]
        args:
          - --workspace
          - --all-targets
          - --all-features
          - --allow-dirty
          - --fix
          - --
          - --deny
          - warnings
        pass_filenames: false

  # Autoformat: toml
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.11.2
    hooks:
      - id: tombi-format

  # Autoformat: python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Lint: python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args:
          - --strict
        # lint only what is known to use typings
        files: |-
          (?x)^(
              bindings/py/python/|
              bindings/java/scripts/
          )
        priority: readonly

  # Lint: javascript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.14.0
    hooks:
      - id: eslint
        # Renovate updates `additional_dependencies` only when `language` is
        # set explicitly
        language: node
        files: ^bindings/js/
        types: [javascript]
        priority: readonly
        additional_dependencies:
          - eslint@^10.14.0
          - "@eslint/js@^10.0.1"
          - globals@^17.14.0

  # Security: github actions security checks
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        args:
          - --fix=safe
          # - --fix=all # fix more things with a manual review

  # Lint: github actions workflows, including shellcheck on `run:` scripts.
  #
  # The upstream hook (rhysd/actionlint) gets shellcheck only as a WebAssembly
  # build, which takes ~25s per run. These PyPI packages ship native binaries.
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        language: python
        entry: actionlint
        additional_dependencies:
          - actionlint-py==1.7.12.25
          - shellcheck-py==0.11.0.1
        types: [yaml]
        files: ^\.github/workflows/
        priority: readonly

  # Lint: shell scripts. Config in .shellcheckrc
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        priority: readonly
