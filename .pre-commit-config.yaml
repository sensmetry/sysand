# prek (Rust version of the Python based pre-commit) is a tool to perform a
# predefined set of tasks manually and/or automatically before git commits are
# made.
#
# We require prek specifically, since we want support for rust based hooks.
#
# pre-commit reference: https://pre-commit.com/#pre-commit-configyaml---top-level
# prek reference:       https://prek.j178.dev/configuration/
#
# Common tasks
#
# - Run once on all files: prek run -a
# - Register git hooks:    prek install
#
# FIXME: transition to a prek official config as we now require prek
#        Blocked until renovate gets prek.toml support:
#        https://github.com/renovatebot/renovate/pull/42254
#
fail_fast: true
# Hook-level `env` needs 0.2.27
minimum_prek_version: "0.2.27"
repos:
  # Autoformat: markdown, yaml, json, js
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.8.1
    hooks:
      - id: prettier
        exclude: |-
          (?x)(
              stdlib_assets/|
              \.lock
          )

  # Autoformat: Ensure SPDX license and copyright headers
  - repo: local
    hooks:
      - id: reuse-annotate
        name: reuse annotate
        # Renovate updates `additional_dependencies` only when `language` is
        # set explicitly
        language: python
        additional_dependencies: [reuse==6.3.0]
        entry: reuse annotate
        args:
          - --license=MIT OR Apache-2.0
          - --copyright=Sysand contributors <opensource@sensmetry.com>
          - --copyright-prefix=spdx-symbol
          - --template=compact
          - --skip-existing
        exclude: |-
          (?x)(
              scripts/install\.sh|
              scripts/install\.ps1
          )
        types_or: [rust, python, java, groovy, shell, xml, javascript]

  # Autoformat: rust
  #
  # rust hooks ignore rust-toolchain.toml; language_version is what pins
  # them. Keep it in sync with rust-toolchain.toml.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt
        description: Formats all bin and lib files of the current workspace using rustfmt.
        language: rust
        language_version: "1.99"
        types: [rust]
        args: ["--"]

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy
        description: Checks all packages in the workspace to catch common mistakes and improve your Rust code.
        language: rust
        language_version: "1.99"
        # Isolate this from all other invocations of any `run_tests.sh`
        # file/manual cargo build/check/clippy, since these run with different
        # features enabled, which causes constant build cache invalidation
        env:
          CARGO_TARGET_DIR: target/prek
        types: [rust]
        args:
          - --workspace
          - --all-targets
          - --all-features
          - --allow-dirty
          - --fix
          - --
          - --deny
          - warnings
        pass_filenames: false

  # Autoformat: toml
  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.3.1
    hooks:
      - id: tombi-format

  # Autoformat: python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Lint: python type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.0
    hooks:
      - id: mypy
        args:
          - --strict
        # lint only what is known to use typings
        files: |-
          (?x)^(
              bindings/py/python/|
              bindings/java/scripts/
          )

  # Lint: javascript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.1.0
    hooks:
      - id: eslint
        # Renovate updates `additional_dependencies` only when `language` is
        # set explicitly
        language: node
        files: ^bindings/js/
        types: [javascript]
        additional_dependencies:
          - eslint@^10.1.0
          - "@eslint/js@^10.0.1"
          - globals@^17.4.0

  # Security: github actions security checks
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.23.1
    hooks:
      - id: zizmor
        args:
          - --fix=safe
          # - --fix=all # fix more things with a manual review

  # Lint: github actions workflows, including shellcheck on `run:` scripts.
  #
  # The upstream hook (rhysd/actionlint) gets shellcheck only as a WebAssembly
  # build, which takes ~25s per run. These PyPI packages ship native binaries.
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        language: python
        entry: actionlint
        additional_dependencies:
          - actionlint-py==1.7.12.25
          - shellcheck-py==0.11.0.1
        types: [yaml]
        files: ^\.github/workflows/

  # Lint: shell scripts. Config in .shellcheckrc
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
