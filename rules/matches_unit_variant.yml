id: matches-unit-variant
severity: warning
language: rust
rule:
  kind: macro_invocation
  all:
    - has:
        field: macro
        regex: ^matches$
    - has:
        kind: token_tree
        regex: ',\s*(?:[A-Za-z_]\w*::)+[A-Z]\w*\s*,?\s*\)$'
message: "compare with `==`, deriving `PartialEq` on the type if needed"
