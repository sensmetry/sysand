id: test-outside-tests-file
severity: warning
language: rust
ignores:
  - "**/*_tests.rs"
  - "**/tests/**"
rule:
  kind: attribute_item
  regex: ^#\[(\w+::)?test(\]|\()
message: "tests live in the module's `<module>_tests.rs` file"
