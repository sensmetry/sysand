id: map-then-map-err-g-closure-id
severity: warning
language: rust
rule:
  any:
    - pattern: $EXPR.map($F).map_err(|$P2| $B2)
    - pattern: $EXPR.map_err(|$P2| $B2).map($F)
constraints:
  F:
    not:
      kind: closure_expression
fix: |-
  match $EXPR {
      Ok(v) => Ok($F(v)),
      Err($P2) => Err($B2),
  }
message: "`match` makes the intent clearer"
