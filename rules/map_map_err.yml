---
# Catches the stray-comment case for every shape
id: map-then-map-err-with-comment
severity: warning
language: rust
rule:
  all:
    - any:
        - pattern: $EXPR.map($X).map_err($Y)
        - pattern: $EXPR.map_err($Y).map($X)
    - not:
        any:
          - pattern:
              context: $EXPR.map($X).map_err($Y)
              strictness: cst
          - pattern:
              context: $EXPR.map_err($Y).map($X)
              strictness: cst
message: "`match` makes the intent clearer; can't be safely auto-fixed due to comment"
