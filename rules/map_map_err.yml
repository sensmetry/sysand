---
id: map-then-map-err-f-closure-id
severity: warning
language: rust
rule:
  any:
    - pattern: $EXPR.map(|$P1| $B1).map_err($G)
    - pattern: $EXPR.map_err($G).map(|$P1| $B1)
constraints:
  G:
    not:
      kind: closure_expression
fix: |-
  match $EXPR {
      Ok($P1) => Ok($B1),
      Err(e) => Err($G(e)),
  }
message: "`match` makes the intent clearer"
