# Remove once clippy adds this, see
# https://github.com/rust-lang/rust-clippy/issues/17469
#
# Several rules below cover the same `.map(F).map_err(G)` (in either order)
# shape, differing only in whether F/G are closures (so their bodies can be
# inlined into the match arms) or arbitrary expressions (so they're called
# instead). Rules are made to avoid overlap.
# Wildcards (`_`) can only be matched literally, so they are separate cases.
#
# `strictness: cst` on each pattern ensures a stray comment sitting outside
# any captured metavariable (e.g. between `.map(...)` and `.map_err(...)`,
# or right before a non-closure F/G argument) blocks the match instead of
# being silently dropped by the fix. Comments inside a captured piece (a
# closure body, or F/G themselves) are unaffected and still preserved.
id: map-then-map-err-both-closures
severity: warning
language: rust
rule:
  any:
    - pattern:
        context: $EXPR.map(|$P1| $B1).map_err(|$P2| $B2)
        strictness: cst
    - pattern:
        context: $EXPR.map_err(|$P2| $B2).map(|$P1| $B1)
        strictness: cst
fix: |-
  match $EXPR {
      Ok($P1) => Ok($B1),
      Err($P2) => Err($B2),
  }
message: "`match` makes the intent clearer"
---
id: map-then-map-err-wild-map
severity: warning
language: rust
rule:
  any:
    - pattern:
        context: $EXPR.map(|_| $B1).map_err(|$P2| $B2)
        strictness: cst
    - pattern:
        context: $EXPR.map_err(|$P2| $B2).map(|_| $B1)
        strictness: cst
fix: |-
  match $EXPR {
      Ok(_) => Ok($B1),
      Err($P2) => Err($B2),
  }
message: "`match` makes the intent clearer"
