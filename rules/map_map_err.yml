id: map-then-map-err-both-wild
severity: warning
language: rust
rule:
  any:
    - pattern: $EXPR.map(|_| $B1).map_err(|_| $B2)
    - pattern: $EXPR.map_err(|_| $B2).map(|_| $B1)
