    - pattern: $EXPR.map(|$P1| $B1).map_err(|_| $B2)
    - pattern: $EXPR.map_err(|_| $B2).map(|$P1| $B1)
fix: |-
  match $EXPR {
      Ok($P1) => Ok($B1),
      Err(_) => Err($B2),
