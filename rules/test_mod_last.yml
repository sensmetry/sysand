id: test-mod-last
severity: warning
language: rust
rule:
  kind: mod_item
  has:
    field: name
    regex: ^tests$
  inside:
    kind: source_file
  precedes:
    stopBy: end
    all:
      - regex: "."
      - not:
          any:
            - kind: line_comment
            - kind: block_comment
message: "declare the test module last in the file"
