# cargo-deny is a tool to lint Rust dependencies for license compliance,
# banned or duplicate crates, and untrusted sources. It is run by
# .github/workflows/dependencies.yml.
#
# Security advisories are checked by osv-scanner (see osv-scanner.toml) for all
# ecosystems in the repo, so the `advisories` check is not used, to keep a single
# list of ignored advisories.
#
# Config reference: https://embarkstudios.github.io/cargo-deny/checks/index.html
#
# Common tasks
#
# - Run the checks used in CI: cargo deny check bans licenses sources
# - Check licenses only:       cargo deny check licenses

[graph]
# All targets we ship binaries, wheels, jars, or wasm for.
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "wasm32-unknown-unknown",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
]
# Most functionality is behind features; check the dependencies of all of them
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "bzip2-1.0.6",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
# Fail on licenses that no dependency uses anymore, so the list stays minimal
unused-allowed-license = "deny"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Require version requirements for registry dependencies; workspace path
# dependencies don't need one
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # TLS is provided by rustls only, see design/architecture.md
  { crate = "native-tls", reason = "use rustls" },
  { crate = "openssl-sys", reason = "use rustls" },
]

[bans.workspace-dependencies]
# Dependencies used by several workspace members (or several times in one)
# should be declared once in `[workspace.dependencies]`
duplicates = "deny"
# Fail on `[workspace.dependencies]` entries that no member uses
unused = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Git dependencies (none currently) must pin a commit
required-git-spec = "rev"
