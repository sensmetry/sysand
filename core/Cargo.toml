[package]
name = "sysand-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true

[features]
# Whether we should be more lenient when validating data in cases where the
# KerML specification is vague.
lenient-checks = []
# Binding support (but not binding libraries themselves)
python = ["dep:pyo3"]
js = ["jiff/js"]
filesystem = ["dep:camino-tempfile", "dep:dirs", "dep:zip"]
networking = ["dep:reqwest", "dep:gix", "dep:rustls", "dep:async-trait", "dep:http"]
# TLS providers. Enabling both is not an error: `--all-features` does it, and
# `tls-aws-lc-rs` wins, because that is what Sysand ships. With neither, a
# consumer that enables `networking` must install a provider itself before the
# first HTTP client is built or the first git fetch runs.
tls-aws-lc-rs = ["rustls?/aws-lc-rs"]
tls-ring = ["rustls?/ring"]
# OS-keyring-backed credential store (not for wasm; the js binding must not
# enable it)
keyring = ["dep:keyring", "dep:dirs"]
# Different compression methods for creating KPARs
kpar-bzip2 = ["zip?/bzip2"]
kpar-zstd = ["zip?/zstd"]
kpar-xz = ["zip?/xz"]
kpar-ppmd = ["zip?/ppmd"]
alltests = []
# Accept the Syside `.meta.json` shape (`root` and `exports`) when reading a
# json project or a KPAR. Its format is not final, so a default build
# refuses it.
syside-kpar = []

[dependencies]
# General
camino.workspace = true
camino-tempfile = { workspace = true, optional = true }
anstyle = { version = "1.0.13", default-features = false, features = ["std"] }
jiff = { workspace = true, features = ["serde"] }
digest = { version = "0.11", default-features = false }
sha2.workspace = true
hex.workspace = true
dirs = { version = "7.0.0", default-features = false, optional = true }
fluent-uri.workspace = true
idna = { version = "1.1.0", default-features = false, features = ["std", "compiled_data"] }
indexmap = { workspace = true, features = ["std", "serde"] }
log = { workspace = true, features = ["std"] }
pubgrub = { version = "0.4.0", default-features = false }
pyo3 = { workspace = true, optional = true, features = ["jiff-02", "indexmap"] }
reqwest-middleware = { workspace = true, features = ["multipart"] }
semver = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std", "preserve_order"] }
sysand-macros = { path = "../macros" }
spdx.workspace = true
thiserror.workspace = true
toml = { workspace = true, features = ["serde", "parse", "display", "preserve_order"] }
typed-path = { workspace = true, features = ["std"] }
zip = { workspace = true, optional = true, features = ["jiff-02"] }
url = { workspace = true, features = ["std"] }
percent-encoding = { version = "2.3.2", default-features = false, features = ["std"] }
gix = { workspace = true, optional = true, features = [
  "blocking-http-transport-reqwest",
  "blocking-network-client",
  "worktree-mutation",
  "status",
  "sha1"
] }
logos = { version = "0.16.1", default-features = false, features = ["std", "export_derive"] }
futures = { version = "0.3.32", default-features = false, features = ["std", "async-await"] }
tokio = { workspace = true, features = ["rt", "io-util", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false }
bytes = { version = "1.11.1", default-features = false, features = ["std"] }
toml_edit = { version = "0.25.4", default-features = false, features = ["parse", "display", "serde"] }
globset = { version = "0.4.18", default-features = false }
# It would be preferable to enable aws-lc-rs/ring on here directly, but no
# feature for `ring` is provided, so we choose `rustls-no-provider` and
# install the chosen provider at runtime ourselves
reqwest = { version = "0.13.2", default-features = false, optional = true, features = [
  "rustls-no-provider",
  "charset",
  "http2",
  "system-proxy",
  "stream",
  "multipart"
] }
# Both only to implement `reqwest_middleware::Middleware`, whose signature
# takes `http::Extensions`
async-trait = { version = "0.1.89", default-features = false, optional = true }
http = { version = "1.4.0", default-features = false, optional = true, features = ["std"] }
# Only to select the crypto provider. reqwest already takes rustls with
# `default-features = false, features = ["std", "tls12"]`, so this adds the
# provider and nothing else.
rustls = { version = "0.23.43", default-features = false, optional = true, features = ["std"] }
dunce = { version = "1.0.5", default-features = false }
icu_normalizer = { version = "2.1.1", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "2.1.1", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.1.2", default-features = false, features = ["compiled_data"] }

# The OS-keyring crate is excluded on musl targets by policy: musl builds
# are containers/CI where the env-var credential path is the norm, so the
# backend reports "absent" and callers fall back to `SYSAND_CRED_*`. On musl
# the keyring feature still compiles.
# keyring's `v1` feature selects the native backend per OS: Keychain on macOS, Credential
# Manager on Windows, and the pure-Rust (i.e. no libdbus or openssl) zbus Secret Service on Linux
[target.'cfg(not(all(target_os = "linux", target_env = "musl")))'.dependencies]
keyring = { version = "4.1.5", optional = true, default-features = false, features = ["v1"] }

[dev-dependencies]
assert_cmd.workspace = true
mockito.workspace = true
port_check = { version = "0.3.0", default-features = false }
predicates.workspace = true
camino-tempfile.workspace = true

[lints]
workspace = true
